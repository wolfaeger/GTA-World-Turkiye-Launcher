<script>
const steps=[["Yükleniyor…",1400],["Güncelleme kontrol ediliyor…",800],["Şehre giriş yapılıyor…",800],["Launcher açılıyor…",700]];
const root=document.getElementById("stage"),t=document.getElementById("t"),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let run=0;
async function play(){
  const id=++run; root.classList.remove("go","out"); t.textContent=steps[0][0]; void root.offsetWidth; root.classList.add("go");
  for(let i=0;i<steps.length;i++){
    if(i){ t.classList.add("swap"); await sleep(180); if(id!==run)return; t.textContent=steps[i][0]; t.classList.remove("swap"); }
    await sleep(steps[i][1]); if(id!==run)return;
  }
  root.classList.add("out"); await sleep(1500); if(id===run) play();
}
document.getElementById("replay").onclick=play; play();
</script></html>
